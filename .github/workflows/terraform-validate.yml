name: Terraform Validate

# Reusable workflow: validates the Terraform root module(s) affected by a PR.
# Runs as a SINGLE job (one PR check): it detects the changed roots (mapping a
# file under a `modules/` subdir to its enclosing root), then runs
# `terraform init -backend=false` + `terraform validate` for each unique root,
# and fails if any root is invalid.
#
# No cloud/backend credentials are required (backend init is skipped).
#
# Invoke from another workflow with:
#   jobs:
#     validate:
#       uses: atvenu/<repo>/.github/workflows/terraform-validate.yml@<ref>
on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version to install. Pin to the version you deploy with.
        type: string
        default: "1.7.5"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List changed Terraform files
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            terraform:
              - added|modified: '**/*.tf'
              - added|modified: '**/*.tfvars'
              - added|modified: '**/*.tftest.hcl'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Validate changed roots
        env:
          FILES: ${{ steps.changed.outputs.terraform_files }}
        run: |
          set -euo pipefail

          if [ -z "${FILES:-}" ] || [ "$FILES" = "[]" ]; then
            echo "No Terraform files changed; nothing to validate."
            exit 0
          fi

          echo "Changed Terraform files: $FILES"

          # Map each changed file to its root module.
          roots=()
          readarray -t file_array < <(jq -r '.[]' <<< "$FILES")
          for file in "${file_array[@]}"; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            case "$dir" in
              */modules/*) root="${dir%%/modules/*}" ;;
              *)           root="$dir" ;;
            esac
            if ! ls "$root"/*.tf >/dev/null 2>&1; then
              if ls "$dir"/*.tf >/dev/null 2>&1; then
                root="$dir"
              else
                continue
              fi
            fi
            roots+=("$root")
          done

          if [ ${#roots[@]} -eq 0 ]; then
            echo "No Terraform root modules to validate."
            exit 0
          fi

          # Deduplicate the roots.
          readarray -t unique_roots < <(printf '%s\n' "${roots[@]}" | sort -u)
          echo "Root modules to validate: ${unique_roots[*]}"

          # Validate every root; collect (don't stop on) failures so all roots
          # are reported in one run.
          failed=()
          for root in "${unique_roots[@]}"; do
            echo "::group::terraform validate: ${root}"
            if terraform -chdir="$root" init -backend=false -input=false \
               && terraform -chdir="$root" validate -no-color; then
              echo "PASS: ${root}"
            else
              echo "FAIL: ${root}"
              failed+=("$root")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::terraform validate failed for: ${failed[*]}"
            exit 1
          fi
          echo "All ${#unique_roots[@]} root(s) valid."
