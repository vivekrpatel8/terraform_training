name: Terraform Validate

# Reusable workflow: `terraform validate` on the roots a PR changes (single check).
# Checks each root is syntactically and semantically valid (references, types, args).
# Roots come from the detect-terraform-roots composite action; each runs
# init -backend=false + validate. No credentials needed.
on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version to install. Pin to the version you deploy with.
        type: string
        default: "1.7.5"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed roots
        id: roots
        uses: ./.github/actions/detect-terraform-roots

      - name: Setup Terraform
        if: steps.roots.outputs.has_roots == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Validate changed roots
        if: steps.roots.outputs.has_roots == 'true'
        env:
          ROOTS: ${{ steps.roots.outputs.roots }}
        run: |
          set -euo pipefail

          readarray -t unique_roots < <(jq -r '.[]' <<< "$ROOTS")
          echo "Root modules to validate: ${unique_roots[*]}"

          # Validate every root; collect (don't stop on) failures so all roots
          # are reported in one run.
          failed=()
          for root in "${unique_roots[@]}"; do
            echo "::group::terraform validate: ${root}"
            if terraform -chdir="$root" init -backend=false -input=false \
               && terraform -chdir="$root" validate; then
              echo "PASS: ${root}"
            else
              echo "FAIL: ${root}"
              echo "  Reproduce locally: cd ${root} && terraform init -backend=false && terraform validate"
              failed+=("$root")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::terraform validate failed for: ${failed[*]}"
            echo "Fix: run the command shown under each failing root, resolve the errors, commit, and push."
            exit 1
          fi
          echo "All ${#unique_roots[@]} root(s) valid."
