name: Terraform Validate

# Reusable workflow: validates the Terraform root module(s) affected by a PR.
#
#   1. dorny/paths-filter lists the changed *.tf / *.tfvars / *.tftest.hcl files
#   2. each changed file is mapped to its root module: a file under a `modules/`
#      subdirectory is attributed to the enclosing root (path stripped at the first
#      `/modules/`); otherwise the file's own directory is the root
#   3. each unique root is validated with `terraform init -backend=false` + `terraform validate`
#
# No cloud/backend credentials are required (backend init is skipped).
#
# Invoke from another workflow with:
#   jobs:
#     validate:
#       uses: atvenu/<repo>/.github/workflows/terraform-validate.yml@<ref>
on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version to install. Pin to the version you deploy with.
        type: string
        default: "1.7.5"

permissions:
  contents: read

jobs:
  discover:
    name: Discover changed roots
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.detect.outputs.roots }}
      has_roots: ${{ steps.detect.outputs.has_roots }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List changed Terraform files
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            terraform:
              - added|modified: '**/*.tf'
              - added|modified: '**/*.tfvars'
              - added|modified: '**/*.tftest.hcl'

      - name: Map changed files to root modules
        id: detect
        env:
          FILES: ${{ steps.changed.outputs.terraform_files }}
        run: |
          set -euo pipefail

          if [ -z "${FILES:-}" ] || [ "$FILES" = "[]" ]; then
            echo "No Terraform files changed."
            echo "has_roots=false" >> "$GITHUB_OUTPUT"
            echo "roots=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed Terraform files: $FILES"

          roots=()
          readarray -t file_array < <(jq -r '.[]' <<< "$FILES")
          for file in "${file_array[@]}"; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            # A file under a `modules/` subdir belongs to the enclosing root module.
            case "$dir" in
              */modules/*) root="${dir%%/modules/*}" ;;
              *)           root="$dir" ;;
            esac
            # Fall back to the file's own directory if the computed root has no .tf
            # (e.g. an unconventional layout, or the root dir was removed).
            if ! ls "$root"/*.tf >/dev/null 2>&1; then
              if ls "$dir"/*.tf >/dev/null 2>&1; then
                root="$dir"
              else
                continue
              fi
            fi
            roots+=("$root")
          done

          if [ ${#roots[@]} -eq 0 ]; then
            echo "No Terraform root modules to validate."
            echo "has_roots=false" >> "$GITHUB_OUTPUT"
            echo "roots=[]" >> "$GITHUB_OUTPUT"
          else
            # Dedupe the roots into a compact JSON array for the matrix strategy.
            json="$(printf '%s\n' "${roots[@]}" | jq -R . | jq -s -c 'unique')"
            echo "Root modules to validate: $json"
            echo "has_roots=true" >> "$GITHUB_OUTPUT"
            echo "roots=$json" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    needs: discover
    if: needs.discover.outputs.has_roots == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.discover.outputs.roots) }}
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color
