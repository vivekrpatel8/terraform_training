name: TerraformFmt

# Reusable workflow: checks Terraform formatting with `terraform fmt`.
# Checks every .tf file is in canonical format (fails on any unformatted file).
# Invoke from another workflow with:
#   jobs:
#     fmt:
#       uses: ./.github/workflows/terraform-fmt.yml
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run terraform fmt from.
        type: string
        default: "."
      terraform-version:
        description: Terraform version to install.
        type: string
        default: "1.7.5"

permissions:
  contents: read

jobs:
  terraform-format:
    name: Check Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform fmt check
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::error::Terraform files are not formatted."
            echo "Fix: run 'terraform fmt -recursive' at the repo root, commit, and push."
            exit 1
          fi
