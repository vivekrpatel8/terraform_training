name: Terraform Lint

# Reusable workflow: `tflint` on the roots a PR changes (single check).
# Checks for lint issues: invalid AWS values, deprecated syntax, best practices.
# Roots come from the detect-terraform-roots composite action.
# Uses a root-level .tflint.hcl (AWS ruleset) if present, else built-in rules.
on:
  workflow_call:
    inputs:
      tflint-version:
        description: tflint version to install.
        type: string
        default: "v0.64.0"

permissions:
  contents: read

jobs:
  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed roots
        id: roots
        uses: ./.github/actions/detect-terraform-roots

      - name: Setup tflint
        if: steps.roots.outputs.has_roots == 'true'
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: Run tflint on changed roots
        if: steps.roots.outputs.has_roots == 'true'
        env:
          ROOTS: ${{ steps.roots.outputs.roots }}
          # Needed by `tflint --init` to download plugins from GitHub releases
          # without hitting the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readarray -t unique_roots < <(jq -r '.[]' <<< "$ROOTS")
          echo "Root modules to lint: ${unique_roots[*]}"

          # Install plugins declared in .tflint.hcl (AWS ruleset, etc.) once, if a
          # config exists at the repo root.
          if [ -f .tflint.hcl ]; then
            export TFLINT_CONFIG_FILE="${GITHUB_WORKSPACE}/.tflint.hcl"
            echo "Using tflint config: $TFLINT_CONFIG_FILE"
            if ! tflint --init; then
              echo "::error::tflint --init failed to download plugins."
              echo "Fix: check the plugin blocks in .tflint.hcl (source/version) and that GITHUB_TOKEN is set."
              exit 1
            fi
          else
            echo "No .tflint.hcl at repo root; using tflint built-in rules."
          fi

          # Lint every root; collect (don't stop on) failures so all roots are
          # reported in one run.
          failed=()
          for root in "${unique_roots[@]}"; do
            echo "::group::tflint: ${root}"
            if tflint --chdir="$root" --recursive --minimum-failure-severity=error; then
              echo "PASS: ${root}"
            else
              echo "FAIL: ${root}"
              echo "  Reproduce locally from repo root: TFLINT_CONFIG_FILE=\$PWD/.tflint.hcl tflint --chdir=${root} --recursive --minimum-failure-severity=error"
              failed+=("$root")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::tflint found issues in: ${failed[*]}"
            echo "Fix: auto-fixable issues -> add --fix to the command above; fix the rest manually, then commit and push."
            exit 1
          fi
          echo "All ${#unique_roots[@]} root(s) passed tflint."
